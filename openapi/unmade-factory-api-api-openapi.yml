      summary: Set In Production
      operationId: factoryOrdersJobsSetInProduction
      description: "If a given order consists of a large number of jobs, production for these jobs may begin at different times. In such a \ncase, it is possible to inform Unmade that individual jobs have begun production using this endpoint. This updates the \nstate of this job's order to `in_production`, but does not affect the state of the other jobs in this order."
