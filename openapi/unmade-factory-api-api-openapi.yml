      summary: Set a Sequence as 'in_production'
      operationId: factoriesSequencesSetInProduction
      description: 'Once manufacturing files have been successfully downloaded for a given Sequence, it should be marked as `in production`. This prevents the Sequence from appearing in subsequent calls to the “Get Sequences” endpoint.

        If a Sequence has not been marked as `in_production`, it remains in the Get Sequences list and its Jobs will be re-sequenced the next time auto-sequencing occurs. This is done to create even more efficient Sequences in combination with new Jobs.


        Sequence IDs are provided in the Get Sequences response.'
      tags:
      - Factory API
      parameters:
      - name: Authorization
        in: header
        description: e.g. Token ABCDEFGHIJKLMNOPQRSTUVWXY
        required: false
        schema:
          type: string
        example: Token ABCDEFGHIJKLMNOPQRSTUVWXY
    servers:
    - url: https://partner-subdomain.embed.unmade.com/
  /factory.unmade.com/v2/orders/:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: List Orders
      operationId: factoryGetOrders
      description: 'This endpoint can be used to retrieve the complete list of all orders that have been created to date.


        This endpoint is paginated and shows a maximum of 10 order objects per response. Use the `page` query parameter to

        select the desired page.


        You can optionally provide `created_before` and `created_after` query parameters in the format `YYYY-MM-DD` to filter

        the listed orders by their creation date.'
      tags:
      - Factory API
      parameters:
      - name: state
        in: query
        description: Show orders with this state (see Order States section above for allowed values)
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        schema:
          type: number
      - name: created_before
        in: query
        description: Show orders created before this date (`YYYY-MM-DD`)
        schema:
          type: string
      - name: created_after
        in: query
        description: Show orders created after this date (`YYYY-MM-DD`)
        schema:
          type: string
      - name: submitted_before
        in: query
        description: Show orders submitted for manufacturing before this date (`YYYY-MM-DD`)
        schema:
          type: string
      - name: submitted_after
        in: query
        description: Show orders submitted for manufacturing after this date (`YYYY-MM-DD`)
        schema:
          type: string
      - name: ecommerce_origin (optional, string) - Show orders with `ecommerce_origin` containing specified string
        in: query
        description: ''
        required: true
        schema:
          type: string
      - name: reference
        in: query
        description: Show orders with `reference` containing specified string
        schema:
          type: string
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
    servers:
    - url: https://partner-subdomain.embed.unmade.com/
  /factory.unmade.com/v2/orders/{order_id}/:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  created:
                    type: string
                  submitted:
                    type: string
                  reference:
                    type: string
                  num_jobs:
                    type: number
                  jobs:
                    type: string
                  shipping_address:
                    type: string
                  ecommerce_order:
                    type: string
                  factory:
                    type: object
                    properties:
                      name:
                        type: string
                      slug:
                        type: string
                  partner_data:
                    type: object
                    properties:
                      my_partner_data_key:
                        type: string
                  attachments:
                    type: object
                    properties:
                      packing_slip:
                        type: string
                      commercial_invoice:
                        type: string
                  summary:
                    type: string
                  state:
                    type: string
                  tracking_data:
                    type: object
                    properties: {}
                  destination_country:
                    type: string
                  shipped: {}
                  cancelled: {}
              example:
                id: a38c331d-cc6d-4e03-b514-91e27ae8b02e
                created: '2017-07-31T16:52:50.905026Z'
                submitted: '2017-07-31T17:44:50.905026Z'
                reference: mc_testorder6
                num_jobs: 4
                jobs: https://factory.unmade.com/v2/orders/a882ac66-9374-4910-8c93-9ea45a470bd4/jobs/
                shipping_address: https://factory.unmade.com/v2/orders/a882ac66-9374-4910-8c93-9ea45a470bd4/shipping_address/
                ecommerce_order: https://partner.embed.unmade.com/v2/orders/a882ac66-9374-4910-8c93-9ea45a470bd4
                factory:
                  name: Factory A
                  slug: factory-a
                partner_data:
                  my_partner_data_key: foo
                attachments:
                  packing_slip: https://cdn.unmade.com/order/900243544001/attachments/packing_slip.pdf
                  commercial_invoice: https://cdn.unmade.com/order/900243544001/attachments/import_invoice.pdf
                summary: https://cdn.unmade.com/order/900243544001/attachments/summary.pdf
                state: in_production
                tracking_data: {}
                destination_country: US
                shipped: null
                cancelled: null
