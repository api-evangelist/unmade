  /factory.unmade.com/v2/orders/{order_id}/jobs/{job_id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content: {}
      summary: Retrieve Job
      operationId: factoryGetOrdersJobs2
      description: "This endpoint can be used to retrieve data for a specific job in a given order. In addition to basic metadata, this \nendpoint provides:\n\n- Structured data describing the various customisation options chosen by the user for this job (eg. selected \n   **components**, **text** and **colours**)\n\n- URLs to one or more `previews` for this job\n\n- The URL for a zip file containing all manufacturing files for this job\n\n- The URL to this job's ticket PDF\n\n### Job States\n\nJobs flow through the same states as [orders](#/group-factory-api#header-order-states), but jobs within an order may each have different states.\n\nJobs also have an additional state: `not_ready` which is used when a given job has been very recently created. This state indicates that manufacturing files are still being generated and are not yet available for download.  You will notice that the `manufacturing_files_zip` field will be `null` for jobs which are still in the `not_ready` state.\n\nWhen a job progresses from state `not_ready` to `new`, the `manufacturing_files_zip` URL will become available. This means that all manufacturing files are ready, and the URL can then be used to download all manufacturing files for a given job.\n\nThe URLs provided by the `manufacturing_files_zip` and `ticket` fields do not require authentication, so can be safely stored and passed to any other systems that may be part of your order management workflow."
      tags:
      - Factory API
      parameters:
      - name: order_id
        in: path
        description: ID of the Order in the form of a uuid
        required: true
        schema:
          type: string
      - name: job_id
        in: path
        description: ID of the job in the form of a uuid
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
