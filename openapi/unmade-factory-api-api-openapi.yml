      summary: Set Order Ex-factory Date
      operationId: factoryOrdersSetExFactoryDate
      description: "On creation, Unmade assigns all production jobs an Ex-factory date based on a lead time estimate which has been \npre-agreed with you and your vendor. This serves as a target date by which the piece is expected to have left the \nfactory location. Jobs within an order can have different Ex-factory dates depending on per-product lead times. In the \ncase of unforeseen delays (or unexpectedly quicker production!) this endpoint can be used to pass an updated Ex-factory \ndate to Unmade. If provided, all jobs in the given order are assigned this updated Ex-factory date. This update also \npropagates up to this order's associated Ecommerce order to allow the Ecommerce system to notify to the end-consumer."
      tags:
      - Factory API
      parameters:
      - name: order_id
        in: path
        description: ID of the Order in the form of a uuid
