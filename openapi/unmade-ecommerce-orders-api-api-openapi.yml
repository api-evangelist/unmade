      description: "This endpoint can be used to retrieve a paginated list of the individual items in a given order. We preserve the order\nin which the items were sent in the original order creation payload. The `id` of each item is generated automatically\nby Unmade when the order is created. You may choose to store this ID in your systems in order to reference each item\ndirectly in future.\n\nEach order item has three associated Design IDs which have different relationships depending on how the relevant \ndesigns were created, as well as the type of order. In the simplest case these Design IDs may be identical, but will \nusually be different, depending on a variety of factors.\n\n- `input_design_id`: The Design ID which you originally sent in the Order creation payload to create this item\n\n- `manufacturing_design_id`: The ID of the design which is being used as the source of all manufacturing data for this \n    item. This will be different to the `input_design_id` if you specified a different size to that of the order \n    item design: in this case Unmade will generate a new design in the specified size\n\n- `source_design_id`: The ID of the Design which was originally saved by the user in the editor. If the Roster API has \n    been used to create the member design for this item, this ID will be the ID of the original roster **template** \n    design.\n\nThese Design IDs can be used in the Design API to view personalisation data or fetch previews relevant to this order \nitem. In most cases you'll want to use the `design_id` value for this purpose."
      tags:
      - Ecommerce Orders API
      parameters:
      - name: order_id
        in: path
