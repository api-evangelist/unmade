      summary: Create an Order
      operationId: createOrders
      description: "Once an order has been placed on the ecommerce platform, the Unmade system should be notified to begin the process of\ngenerating manufacturing files. To do this, pass a unique order reference, and one or more order items to this endpoint\nvia an HTTP POST request. Each item must reference an Unmade Design ID. The same Design ID can be used for multiple\norder items, if provided with different `size` values inside the `options` object. To order multiple identical garments\nin the same size, use the `quantity` value. Each item must also have a `unit_price` object with both a `value` and\n`currency` specified. Depending on the nature of your integration with Unmade, a `shipping_address` may also be required\nfor order creation.\n\nOptionally, arbitrary key-value pairs can be passed as a `partner_data` object at both the order and order item level. \nThis may be used by your system to provide your internal ID or similar reference for this order which may be relevant\nfor integration with your vendor. These key-value pairs will also be present on the manufacturing order and jobs \nassociated with this ecommerce order.\n\nIf you want to create the order and keep it on hold for subsequent updates to the `partner_data` you might do it by\nsending the boolean value for `set_order_on_hold` as `true`.\n\nYou may optionally provide a boolean value for the `is_test_order` field to indicate a given order is not a real\nproduction order. If this value is set to `true`, the order will be omitted from Unmade billing processes. Speak to your\nUnmade representative for more information about recommended integration testing procedures."
      tags:
      - Ecommerce Orders API
      parameters:
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
      requestBody:
        content:
          application/json:
            example:
              reference: YOUR UNIQUE ORDER REFERENCE
              order_items:
              - design: UNMADE-DESIGN-ID
                reference: YOUR ORDER-ITEM REFERENCE
                quantity: 2
                unit_price:
                  value: '99.99'
                  currency: USD
                options:
                  size: M
                partner_data:
                  barcode: '98323928238372'
              partner_data:
                example_po_number: example_number
                example_po_type: example_value
              shipping_address:
                name: John Smith
                company_name: unmade
                address_1: 152 Strand
                address_2: Somerset House
                city: London
                postal_code: WC2R 1LA
                country: GB
                country_area: London
                phone: 0123456789
                email: john@smith.com
            schema:
              type: object
              properties:
                reference:
                  type: string
                  description: Your unique reference for this order. Max 256 characters.
                order_items:
                  type: array
