                    example_po_number:
                      type: string
                    example_po_type:
                      type: string
                    example_shipping_method:
                      type: string
                order_items:
                  type: array
                  items:
                    type: object
                    properties:
                      design:
                        type: string
                      reference:
                        type: string
                      quantity:
                        type: number
                      unit_price:
                        type: number
                      currency:
                        type: string
                      options:
                        type: object
                        properties:
                          size:
                            type: string
                      partner_data:
                        type: object
                        properties:
                          barcode:
                            type: string
                shipping_address:
                  type: object
                  properties:
                    name:
                      type: string
                    company_name:
                      type: string
                    address_1:
                      type: string
                    address_2:
                      type: string
                    city:
                      type: string
                    country_area:
                      type: string
                    postal_code:
                      type: string
                    country:
