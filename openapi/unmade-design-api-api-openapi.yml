        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  detail:
                    type: object
                    properties:
                      last-name:
                        type: array
                        items:
                          type: object
                          properties:
                            error:
                              type: string
                            details:
                              type: object
                              properties:
                                amended_text:
                                  type: string
                          required:
                          - error
                          - details
                      number:
                        type: array
                        items:
                          type: object
                          properties:
                            error:
                              type: string
                            details:
                              type: object
                              properties:
                                amended_text:
                                  type: string
              example:
                code: bad_request
                message: Request payload is not valid.
                detail:
                  last-name:
                  - error: text_too_wide
                    details:
                      amended_text: shorter text
                  - error: text_sanitised
                    details:
                      amended_text: sanitised text
                  number:
                  - error: illegal_characters
                    details:
                      amended_text: text with no illegal chars
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: authentication_failed
                message: Incorrect authentication credentials.
        '404':
