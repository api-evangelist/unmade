  /v2/designs/{design_id}/clone/:
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  size:
                    type: array
                    items:
                      type: string
              example:
                size:
                - 'Size M does not exist on product my-product. Available sizes: S, L, XL'
      summary: Clone Design
      operationId: designsClone
      description: ''
      tags:
      - Design API
      parameters:
      - name: design_id
        in: path
        description: ID of the Design in the form of a uuid
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
      requestBody:
        content:
          application/json:
            example:
              size: M
            schema:
              type: object
              properties:
                size:
                  type: string
                  description: A valid size for the product this design belongs to (e.g. `S`, `M`, `L`).
              required:
              - size
  /v2/collections/{slug}/transfer_designs/:
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  designs:
                    type: array
                    items:
                      type: object
                      properties:
                        product_slug:
                          type: string
                        id:
                          type: string
                      required:
                      - product_slug
                      - id
              example:
                designs:
                - product_slug: product-b
                  id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                - product_slug: product-c
                  id: b2c3d4e5-f6a7-8901-bcde-f12345678901
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  design_id:
                    type: array
                    items:
                      type: string
              example:
                design_id:
                - Design 8a2b6517-e020-46fd-8cd0-ec441d4ac4b4 does not exist.
      summary: Transfer Designs
      operationId: createCollectionsTransferDesigns
      description: ''
      tags:
      - Design API
      parameters:
      - name: slug
        in: path
        description: Slug of the Collection
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
      requestBody:
        content:
          application/json:
            example:
              design_id: 8a2b6517-e020-46fd-8cd0-ec441d4ac4b4
            schema:
              type: object
              properties:
