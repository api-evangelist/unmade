paths:
  /v1/transfer_previews/:
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  previews:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        image:
                          type: string
                        thumbnail:
                          type: string
                      required:
                      - name
                      - image
                      - thumbnail
              example:
                previews:
                - name: front
                  image: v1/transfer_previews/1/preview/
                  thumbnail: v1/transfer_previews/1/thumbnail/
                - name: back
                  image: v1/transfer_previews/2/preview/
                  thumbnail: v1/transfer_previews/2/thumbnail/
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  original_request:
                    type: string
              example:
                code: authentication_failed
                message: Incorrect authentication credentials.
                original_request: <the original request that was sent, which resulted in this error>
        '404':
          description: Not Found
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: not_found
                message: Not found.
        '405':
          description: Method Not Allowed
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              example:
                code: method_not_allowed
                message: Method used is not allowed
      summary: Create Transfer Previews
      operationId: transferPreviews
      description: ''
      tags:
      - Transfer Preview API
      parameters:
      - name: Authorization
        in: header
        description: e.g. Token ABCDEF
        required: false
        schema:
          type: string
        example: Token ABCDEF
      requestBody:
        content:
          application/json:
            example:
              product: <product-slug>
              design: <design-id>
            schema:
              type: object
              properties:
                product:
                  type: string
                design:
                  type: string
