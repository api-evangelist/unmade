aid: unmade
name: Unmade
description: Unmade is a London fashion-tech company whose UnmadeOS platform lets
  apparel and sportswear brands such as New Balance and Rapha sell customised,
  on-demand products at scale. Its partner Integration API embeds the Unmade Editor
  in e-commerce product pages, captures saved designs, renders previews and 3D
  views, creates ecommerce orders from design IDs, and drives factory production
  workflows through to shipping. Founded in 2013 and Techstars-backed, Unmade was
  acquired by garment manufacturer Hi-Tech Apparel in July 2024.
